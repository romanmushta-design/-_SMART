<script>
const $=s=>document.querySelector(s);
const CATS={money:'💰 Деньги',weight:'⚖️ Вес и здоровье',study:'📚 Учёба',other:'🎯 Другое'};
let goals=[],store=null,sample=null,editId=null,aiText={},pendingDel=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n.toFixed(1)).toLocaleString('ru-RU');
const today=()=>new Date().toISOString().slice(0,10);
const setSync=t=>$('#sync').textContent=t;

function entries(g){return (g.entries||[]).slice().sort((a,b)=>a.d.localeCompare(b.d))}
function cur(g){const e=entries(g);return e.length?e[e.length-1].v:g.start}
function pct(g){const t=g.target-g.start;if(!t)return 100;return Math.max(0,Math.min(100,(cur(g)-g.start)/t*100))}
function daysLeft(g){return Math.ceil((new Date(g.deadline+'T23:59:59')-Date.now())/864e5)}
function status(g){
  const p=pct(g);if(p>=100)return{k:'done',t:'Цель достигнута 🎉'};
  const s=new Date(g.created).getTime(),e=new Date(g.deadline+'T23:59:59').getTime(),n=Date.now();
  if(n>e)return{k:'bad',t:'Срок истёк'};
  const tp=Math.max(0,Math.min(1,(n-s)/(e-s)))*100,d=p-tp;
  if(d>=5)return{k:'ok',t:'Опережаете график'};
  if(d>-10)return{k:'ok',t:'По графику'};
  return{k:'warn',t:'Отстаёте от графика'};
}
function tips(g){
  const st=status(g),out=[],rem=g.target-cur(g),dl=daysLeft(g),e=entries(g);
  if(st.k==='done')return['Отметьте успех и поставьте следующую цель — чуть амбициознее.'];
  if(dl>0){const w=Math.max(dl/7,1/7),per=Math.abs(rem)/w;out.push(`До срока ${dl} дн. Нужный темп: ${fmt(per)} ${esc(g.unit)} в неделю.`);
    if(g.cat==='weight'&&/кг|kg/i.test(g.unit)&&per>1)out.push('Темп выше ~1 кг в неделю — это тяжело и рискованно для здоровья. Лучше сдвиньте срок.');}
  const last=e.length?Math.floor((Date.now()-new Date(e[e.length-1].d))/864e5):Math.floor((Date.now()-new Date(g.created))/864e5);
  if(last>=7)out.push(`Последняя отметка была ${last} дн. назад. Внесите актуальное значение — без этого трекинг не работает.`);
  if(st.k==='warn'||st.k==='bad')out.push('Разбейте цель на недельные мини-шаги или честно пересмотрите срок. Лучше скорректировать план, чем бросить цель.');
  if(st.k==='ok')out.push('Хороший ход. Закрепите привычку: выберите фиксированный день недели для отметки.');
  if(g.cat==='money')out.push('Для денег лучше всего работает автоперевод в день дохода — до того, как деньги потратятся.');
  if(g.cat==='weight')out.push('Следите за трендом за 2–3 недели, а не за ежедневными колебаниями.');
  const f=forecast(g);
  if(f&&pct(g)<100){out.unshift(f.never?'По текущему тренду цель не приближается: динамика идёт в другую сторону.':f.date.getFullYear()>new Date().getFullYear()+5?'При текущем темпе цель достигнется нескоро: нужно ускориться.':`Прогноз по тренду: цель около ${f.date.toLocaleDateString('ru-RU')} (${f.diff>3?`на ${Math.round(f.diff)} дн. позже срока`:f.diff<-3?`на ${Math.round(-f.diff)} дн. раньше срока`:'примерно в срок'}).`)}
  {const p0=pct(g),q=[.25,.5,.75].find(q=>p0<q*100-0.01);if(q&&p0<100){const t0=new Date(g.created.slice(0,10)).getTime(),t1=new Date(g.deadline+'T00:00:00').getTime();out.push(`Ближайшая веха (${q*100}%): ${fmt(g.start+(g.target-g.start)*q)} ${esc(g.unit)} к ${new Date(t0+(t1-t0)*q).toLocaleDateString('ru-RU')}.`)}}
  out.push(...moneyTip(g));
  return out.concat(subTips(g));
}
function spark(g){
  const pts=[{d:g.created.slice(0,10),v:g.start},...entries(g)];
  if(pts.length<2)return'';
  const t=x=>new Date(x).getTime(),t0=t(pts[0].d),t1=Math.max(t(pts[pts.length-1].d),t0+864e5);
  const vs=pts.map(p=>p.v).concat(g.target),mn=Math.min(...vs),mx=Math.max(...vs),r=(mx-mn)||1;
  const xy=p=>`${4+(t(p.d)-t0)/(t1-t0)*292},${40-(p.v-mn)/r*36}`;
  const ty=40-(g.target-mn)/r*36;
  return `<svg viewBox="0 0 300 44" preserveAspectRatio="none"><line x1="0" x2="300" y1="${ty}" y2="${ty}" stroke="var(--mut)" stroke-dasharray="3 3"/><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${pts.map(xy).join(' ')}"/></svg>`;
}
function chart(g){
  const W=480,H=180,L=44,R=14,T=18,B=24,e=entries(g),day=x=>new Date(String(x).slice(0,10)).getTime();
  const t0=day(g.created),t1=Math.max(day(g.deadline),t0+864e5),nw=Date.now();
  const vs=[g.start,g.target,...e.map(p=>p.v)],lo=Math.min(...vs),hi=Math.max(...vs),pd=(hi-lo)*.12||1,mn=lo-pd,mx=hi+pd;
  const X=t=>L+Math.max(0,Math.min(1,(t-t0)/(t1-t0)))*(W-L-R),Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  const pts=[{x:X(t0),y:Y(g.start),v:g.start,d:g.created.slice(0,10)},...e.map(p=>({x:X(day(p.d)),y:Y(p.v),v:p.v,d:p.d}))];
  const line=pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' '),last=pts[pts.length-1],base=H-B,id='gr'+g.id;
  const dm=t=>new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
  const sc={done:'--ok',ok:'--ok',warn:'--warn',bad:'--bad'}[status(g).k];
  const grid=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--ln)"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end" font-size="9" fill="var(--mut)">${fmt(v)}</text>`).join('');
  const today=nw>t0&&nw<t1?`<line x1="${X(nw)}" x2="${X(nw)}" y1="${T}" y2="${base}" stroke="var(--mut)" stroke-width=".8" stroke-dasharray="2 3"/><text x="${X(nw)}" y="9" text-anchor="middle" font-size="9" fill="var(--mut)">сегодня</text>`:'';
  return `<svg class="ch" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ac);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--ac);stop-opacity:0"/></linearGradient></defs>${grid}
<line x1="${L}" x2="${W-R}" y1="${Y(g.target)}" y2="${Y(g.target)}" stroke="var(--ok)" stroke-width="1.2" stroke-dasharray="5 3"/><text x="${W-R}" y="${Y(g.target)-4}" text-anchor="end" font-size="9" fill="var(--ok)">цель ${fmt(g.target)}</text>
<line x1="${X(t0)}" y1="${Y(g.start)}" x2="${X(t1)}" y2="${Y(g.target)}" stroke="var(--mut)" stroke-width="1.2" stroke-dasharray="2 4"/>
${today}${forecastLine(g,X,Y,t1)}${msMarks(g,X,Y,t0,t1)}<polygon points="${pts[0].x},${base} ${line} ${last.x},${base}" fill="url(#${id})"/>

function forecast(g){
  const E=entries(g);if(E.length<3)return null;
  const d0=new Date(g.created.slice(0,10)).getTime(),P=[[0,g.start],...E.map(p=>[(new Date(p.d)-d0)/864e5,p.v])],n=P.length;
  const sx=P.reduce((a,p)=>a+p[0],0),sy=P.reduce((a,p)=>a+p[1],0),sxx=P.reduce((a,p)=>a+p[0]*p[0],0),sxy=P.reduce((a,p)=>a+p[0]*p[1],0),den=n*sxx-sx*sx;
  if(!den||P[n-1][0]<3)return null;
  const k=(n*sxy-sx*sy)/den,b=(sy-k*sx)/n;
  if(k*(g.target-g.start)<=0)return{k,b,d0,never:true};
  const date=new Date(d0+((g.target-b)/k)*864e5);
  if(!isFinite(date.getTime()))return{k,b,d0,never:true};
  return{k,b,d0,date,diff:(date-new Date(g.deadline+'T00:00:00'))/864e5};
}
function forecastLine(g,X,Y,t1){

  const e=entries(g),l=e[e.length-1],tl=new Date(l.d).getTime(),v1=f.b+f.k*((t1-f.d0)/864e5);
  return `<line x1='${X(tl)}' y1='${Y(l.v)}' x2='${X(t1)}' y2='${Math.max(18,Math.min(156,Y(v1)))}' stroke='var(--warn)' stroke-width='2' stroke-dasharray='1 5' stroke-linecap='round'/>`;
}
function moneyTip(g){
  if(g.cat!=='money'||g.target<=g.start)return[];
  const r=(g.rate||0)/1200,c=cur(g),m=Math.max(Math.round((new Date(g.deadline+'T00:00:00')-Date.now())/2629800000),0),o=[];
  if(m>=1){const gf=Math.pow(1+r,m),need=r?(g.target-c*gf)*r/(gf-1):(g.target-c)/m;
    o.push(need<=0?'Накопленное уже вырастет до цели за счёт процентов, взносы не обязательны.':`Чтобы успеть к сроку${g.rate?` при ${fmt(g.rate)}% годовых`:''}, нужно откладывать около ${fmt(need)} ${esc(g.unit)} в месяц.`)}
  if(g.pmt>0){let v=c,i=0;while(v<g.target&&i<600){v=v*(1+r)+g.pmt;i++}
    if(i<600){const d=new Date();d.setMonth(d.getMonth()+i);o.push(`С вашим взносом ${fmt(g.pmt)} ${esc(g.unit)} в месяц цель будет достигнута примерно через ${i} мес. (${d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}); расчёт с ежемесячной капитализацией, без налогов.`)}}
  return o;
}
function heat(g,s){
  const m=new Date(wkStart(iso(new Date()))+'T00:00:00'),W=12,td=iso(new Date());let c='';
  for(let w=0;w<W;w++)for(let d=0;d<7;d++){

    c+=`<rect x='${w*17}' y='${d*17}' width='14' height='14' rx='4' fill='${f}' opacity='${o}'><title>${k}: ${fmt(v)}</title></rect>`;

async function loadAll(){

async function startSynced(session){
  if(uid===session.user.id&&store)return;
  uid=session.user.id;$('#auth').hidden=true;$('#list').hidden=false;
  store={
    save:async g=>{
      const i=goals.findIndex(x=>x.id===g.id);i<0?goals.push(g):goals[i]=g;render();
      const {error}=await sb.from('goals').upsert({user_id:uid,id:g.id,data:g,updated_at:new Date().toISOString()},{onConflict:'user_id,id'});
      setSync(error?'Ошибка сохранения':'Синхронизировано ✓');
    },
    del:async id=>{
      goals=goals.filter(x=>x.id!==id);render();
      const {error}=await sb.from('goals').delete().eq('id',id);
      setSync(error?'Ошибка удаления':'Синхронизировано ✓');
    }
  };
  await loadAll();
  sb.channel('goals-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'goals'},()=>loadAll()).subscribe();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&store)loadAll()});
}
